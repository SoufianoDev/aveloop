[package]
name = "aveloop"
version = "0.1.0"
edition = "2021"
authors = ["SoufianoDev"]
license = "Apache-2.0"
description = "Native cross-platform C/C++ development environment built with Rust and GPUI"

[dependencies]
# UI Framework & Primitives: GPUI Kit backed by GPUI Fast
gpui-kit = { version = "0.10.0", features = ["gpui-fast", "component", "assets"] }

# Data & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
anyhow = "1.0"
thiserror = "2.0"
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"

[[bin]]
name = "t008_verify"
path = "verification/T008/t008_verify.rs"

[[bin]]
name = "t012_verify"
path = "verification/T012/t012_verify.rs"

[[bin]]
name = "t013_verify"
path = "verification/T013/t013_verify.rs"

[[bin]]
name = "t016_verify"
path = "verification/T016/t016_verify.rs"

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["gpui-fast", "test-support"] }
