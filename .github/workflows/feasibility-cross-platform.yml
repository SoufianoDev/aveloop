name: Cross-Platform Feasibility Verification

on:
  push:
    branches:
      - ci/platform-matrix-verification
  workflow_dispatch:

jobs:
  macos-feasibility:
    name: macOS Verification (T007, T009, T010, T011)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: System and Toolchain Inventory
        run: |
          uname -a
          xcrun --find clang
          clang --version
          xcrun --find lldb
          lldb --version

      - name: T009 — macOS C17 and C++20 Debug Builds
        run: |
          cat << 'EOF' > c17_test.c
          #include <stdio.h>
          _Static_assert(__STDC_VERSION__ == 201710L, "C17 required");
          int main(void) {
              printf("macOS C17 ok: %ld\n", (long)__STDC_VERSION__);
              return 0;
          }
          EOF
          clang -std=c17 -g -O0 -Wall -Wextra -pedantic-errors -o c17_test c17_test.c
          ./c17_test

          cat << 'EOF' > cxx20_test.cpp
          #include <concepts>
          #include <iostream>
          template <std::integral T>
          constexpr T double_val(T x) { return x * 2; }
          int main() {
              static_assert(__cplusplus >= 202002L);
              std::cout << "macOS C++20 ok: " << double_val(21) << std::endl;
              return 0;
          }
          EOF
          clang++ -std=c++20 -g -O0 -Wall -Wextra -pedantic-errors -o cxx20_test cxx20_test.cpp
          ./cxx20_test

      - name: T010 & T011 — macOS LLDB Capabilities and Protocol Check
        run: |
          cat << 'EOF' > lldb_test.py
          import subprocess, json, shutil

          lldb_dap_bin = shutil.which("lldb-dap")
          if not lldb_dap_bin:
              res = subprocess.run(["xcrun", "--find", "lldb-dap"], capture_output=True, text=True)
              if res.returncode == 0:
                  lldb_dap_bin = res.stdout.strip()

          print(f"lldb-dap binary: {lldb_dap_bin}")
          if lldb_dap_bin:
              p = subprocess.Popen([lldb_dap_bin], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              req = json.dumps({"seq": 1, "type": "request", "command": "initialize", "arguments": {"clientID": "aveloop", "adapterID": "lldb-dap"}})
              header = f"Content-Length: {len(req)}\r\n\r\n"
              p.stdin.write((header + req).encode('utf-8'))
              p.stdin.flush()
              
              buf = b""
              while b"\r\n\r\n" not in buf:
                  byte = p.stdout.read(1)
                  if not byte:
                      break
                  buf += byte
              
              length = 0
              for line in buf.decode('utf-8', errors='ignore').split("\r\n"):
                  if line.startswith("Content-Length:"):
                      length = int(line.split(":")[1].strip())
              resp = p.stdout.read(length)
              init_resp = json.loads(resp.decode('utf-8'))
              print("DAP Initialize response:")
              print(json.dumps(init_resp, indent=2))
              body = init_resp.get("body", {})
              print(f"supportsStepBack: {body.get('supportsStepBack', False)}")
              p.terminate()
          
          print("Testing LLDB CLI batch execution:")
          subprocess.run(["lldb", "--batch", "-o", "b main", "-o", "r", "-o", "bt", "-o", "q", "./c17_test"], check=True)
          EOF
          python3 lldb_test.py

      - name: T007 — macOS GPUI Application Build
        run: |
          cargo check --workspace --tests

  windows-feasibility:
    name: Windows x86_64 Verification (T006, T009, T010, T011)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Toolchain Inventory (MSVC & Clang)
        shell: cmd
        run: |
          where cl
          where link
          where clang || ver

      - name: T009 — Windows MSVC C17 and C++20 Debug Builds
        shell: cmd
        run: |
          echo #include ^<stdio.h^> > c17_win.c
          echo int main(void) { printf("Windows C17 ok\n"); return 0; } >> c17_win.c
          cl /std:c17 /Zi /Od /W4 c17_win.c /Fe:c17_win.exe
          c17_win.exe

          echo #include ^<iostream^> > cxx20_win.cpp
          echo #include ^<concepts^> >> cxx20_win.cpp
          echo template^<std::integral T^> T dbl(T x) { return x * 2; } >> cxx20_win.cpp
          echo int main() { std::cout ^<^< "Windows C++20 ok: " ^<^< dbl(21) ^<^< std::endl; return 0; } >> cxx20_win.cpp
          cl /std:c++20 /Zi /Od /W4 /EHsc cxx20_win.cpp /Fe:cxx20_win.exe
          cxx20_win.exe

      - name: T010 & T011 — Windows Debugger and Capability Verification
        shell: cmd
        run: |
          dumpbin /HEADERS cxx20_win.exe | findstr /i "cv"

      - name: T006 — Windows GPUI Application Build
        shell: cmd
        run: |
          cargo check --workspace --tests
