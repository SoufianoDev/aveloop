name: T013 Tree-sitter C/C++ grammar verification

on:
  push:
    branches: [feat/gpui-kit-fast, dev]
    paths:
      - 'src/bin/t013_verify.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/t013-tree-sitter.yml'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x86_64
          - os: windows-2022
            label: Windows x86_64
          - os: macos-latest
            label: macOS arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build t013_verify
        run: cargo build --bin t013_verify

      - name: Run t013_verify
        run: cargo run --bin t013_verify
